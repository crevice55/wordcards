{% extends 'base.html' %}

{% block title %}Удаление карточки — WordCards{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Удаление карточки</h1>
                <p>
                    Удалить карточку <strong>{{ card.word }} — {{ card.translation }}</strong>
                    из курса «{{ card.course.title }}»?
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'course_detail' card.course.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
