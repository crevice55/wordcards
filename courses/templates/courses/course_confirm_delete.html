{% extends 'base.html' %}

{% block title %}Удаление курса — WordCards{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Удаление курса</h1>
                <p>
                    Вы действительно хотите удалить курс <strong>{{ course.title }}</strong>?
                    Все его карточки ({{ course.cards.count }}) тоже будут удалены.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                        <a href="{% url 'course_detail' course.pk %}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
