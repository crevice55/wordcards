{% extends 'base.html' %}

{% block title %}Вход — WordCards{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Вход</h1>
                {% if form.errors %}
                    <div class="alert alert-danger">
                        Неверное имя пользователя или пароль. Попробуйте ещё раз.
                    </div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Имя пользователя</label>
                        <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                               class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Пароль</label>
                        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                               class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
